<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paperbook</title>
<meta name="description" content="Visor de documentos con anotaciones a mano y sincronización con Google Drive.">
<meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191816" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<section id="welcome" hidden aria-label="Bienvenida">
  <div class="wbox">
    <div class="wbrand">Paperbook</div>
    <h1>Tus documentos, <mark>anotados a mano</mark>, en todos tus dispositivos</h1>
    <p>Guarda PDF y páginas web, escribe encima con lápiz o dedo, busca dentro del texto y sincroniza con Google Drive.</p>
    <div class="wactions">
      <a class="btn primary big" id="w-download" href="descargar.html">Descargar la app</a>
      <button class="btn big" id="w-use" type="button">Usar ahora en el navegador</button>
    </div>
    <p class="wnote">Disponible para Android, Windows y Linux. En el navegador no hay que instalar nada.</p>
  </div>
</section>
<main id="library"></main>
<section id="viewer" hidden aria-label="Visor de documentos"></section>
<noscript>Paperbook necesita JavaScript.</noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
